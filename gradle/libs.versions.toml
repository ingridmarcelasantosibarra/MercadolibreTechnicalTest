#Coil
io-coil-kt-coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilVersion" }
io-coil-kt-coil-gif = { group = "io.coil-kt", name = "coil-gif", version.ref = "coilVersion" }
