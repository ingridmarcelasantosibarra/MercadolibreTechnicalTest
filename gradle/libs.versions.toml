jacoco-org = { group = "org.jacoco", name = "org.jacoco.core", version.ref = "core" }
#Permission
com-google-accompanist-accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "appcompanist-permissions" }
#Paging
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version = "3.3.6" }
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version = "3.3.6" }
#Testing
androidx-arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "core-testing" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito-version" }
mockito-inline = {group = "org.mockito", name = "mockito-inline", version.ref = "mockito-version" }
io-mockk = {group = "io.mockk", name = "mockk", version.ref = "mockk-version" }
io-mockk-android = {group = "io.mockk", name = "mockk-android", version.ref = "mockk-version" }
org-jetbrains-kotlinx-kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotli-coroutines-test" }
com-google-truth = { group = "com.google.truth", name = "truth", version.ref = "truth-version" }
com-squareup-okhttp3-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mock-web-server-version" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"}
com-google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "plug-google-devtools-ksp" }
com-google-dagger-hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt-version" }
