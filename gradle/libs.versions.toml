com-android-tools-build-gradle = { group = "com.android.tools.build", name = "gradle", version.ref = "build-androidBuildToolsVersion" }
org-jetbrains-kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "build-gradlePluginVersion" }
com-google-gms-google-services = { group = "com.google.gms", name = "google-services", version.ref = "build-googlePlayServicesVersion" }

#DaggerHilt
com-google-dagger-hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt-version" }
